[package]
name = "fbrustapi"
version = "1.2.3"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros", "tokio", "http1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "std"] }
thiserror = "2"
tower-http = { version = "0.6", features = ["trace"] }
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "time", "rust_decimal", "macros", "tls-rustls"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
single_match_else = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
module_name_repetitions = "allow"
redundant_closure_for_method_calls = "allow"
manual_let_else = "allow"
uninlined_format_args = "allow"

[lints.rust]
unused_imports = "deny"
dead_code = "warn"
unused_must_use = "deny"

[dev-dependencies]
tower = "0.5"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
