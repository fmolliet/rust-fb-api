openapi: "3.0.3"
info:
  title: Meeting Service API
  description: |
    API de gerenciamento de reuniões (Meetings).
    
    ## Visão Geral
    
    O serviço permite criar, listar, buscar, atualizar e desativar reuniões.
    Cada reunião possui um identificador `snowflake` único usado como chave de lookup,
    além do `id` numérico auto-incremento.
    
    ## Funcionalidades
    
    - **Criar reunião** — POST `/meeting` com name, snowflake e state
    - **Listar reuniões** — GET `/meeting` com paginação (padrão: 1000 itens/página)
    - **Buscar por snowflake** — GET `/meeting/{id}` onde `{id}` é o snowflake string
    - **Listar por estado** — GET `/meeting/state/{state}` com paginação
    - **Atualizar reunião** — PUT `/meeting` com snowflake obrigatório (partial update)
    - **Desativar reunião** — DELETE `/meeting/{id}` onde `{id}` é o ID numérico (soft delete)
    
    ## Notas de Compatibilidade
    
    - O campo `active` é um soft-delete: ao deletar, a reunião fica inativa mas permanece no banco
    - Atualizar uma reunião reativa automaticamente (`active = true`)
    - A paginação usa os parâmetros `page`, `size` e `sort` do Spring Data
    - O endpoint `GET /meeting/{id}` usa o campo `snowflake` como path param, não o ID numérico
    - O endpoint `DELETE /meeting/{id}` usa o ID numérico, não o snowflake
  version: "1.0.0"
  contact:
    name: Winty Struct Team
    url: https://winty.io

servers:
  - url: http://localhost:8080
    description: Servidor local

paths:
  /meeting:
    get:
      summary: Listar reuniões ativas
      description: |
        Retorna lista paginada de todas as reuniões ativas (`active = true`).
        
        **Comportamento:**
        - Retorna apenas reuniões com `active = true`
        - Paginação via query params: `page` (padrão 0), `size` (padrão 1000), `sort`
        - Resposta no formato Spring Data Page (content, totalElements, totalPages, etc.)
      operationId: listMeetings
      tags:
        - Meetings
      parameters:
        - name: page
          in: query
          description: Número da página (zero-indexed)
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: Tamanho da página
          required: false
          schema:
            type: integer
            format: int32
            default: 1000
        - name: sort
          in: query
          description: |
            Critério de ordenação. Formato: `propriedade,direção`
            Ex: `name,asc` ou `snowflake,desc`
            Direções aceitas: `asc` (padrão), `desc`
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Lista paginada de reuniões ativas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMeetingDTO"
              example:
                content:
                  - id: 1
                    name: "Reunião de Planejamento"
                    snowflake: "abc-123-def"
                    state: "SP"
                  - id: 2
                    name: "Retrospectiva"
                    snowflake: "xyz-456-uvw"
                    state: "RJ"
                totalElements: 2
                totalPages: 1
                size: 1000
                number: 0
        "500":
          description: Erro interno ao processar a requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    post:
      summary: Criar nova reunião
      description: |
        Cria uma nova reunião com os dados fornecidos.
        
        **Regras:**
        - `snowflake` deve ser único no sistema
        - `snowflake` e `state` são obrigatórios
        - Retorna 409 Conflict se `snowflake` já existir
        - Define automaticamente `active = true`
      operationId: createMeeting
      tags:
        - Meetings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeetingDTO"
            example:
              name: "Reunião de Planejamento Q4"
              snowflake: "snowflake-abc-123"
              state: "SP"
      responses:
        "200":
          description: Reunião criada com sucesso
          headers:
            Location:
              description: URL para a reunião criada
              schema:
                type: string
                format: uri
                example: "/meeting/1"
          content: {}
        "400":
          description: Dados de entrada inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Validation failed"
                instance: "/meeting"
                violations:
                  - field: "snowflake"
                    message: "must not be blank"
                  - field: "state"
                    message: "must not be blank"
        "409":
          description: Conflict — snowflake já existe no sistema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Conflict"
                status: 409
                detail: "Duplicate entry 'snowflake-abc-123' for key 'meeting_snowflake_key'"
      security: []

  /meeting/{id}:
    get:
      summary: Buscar reunião por snowflake
      description: |
        Busca uma reunião pelo seu identificador `snowflake` (string), não pelo ID numérico.
        
        **Nota de Compatibilidade:**
        - O path param `{id}` recebe o valor de `snowflake`, não o `id` numérico
        - Retorna `null` (200 OK) se não encontrado — comportamento legado
        - Em caso de erro interno, retorna 200 com body `null`
      operationId: getMeetingBySnowflake
      tags:
        - Meetings
      parameters:
        - name: id
          in: path
          description: O snowflake da reunião (string única, não o ID numérico)
          required: true
          schema:
            type: string
            example: "snowflake-abc-123"
      responses:
        "200":
          description: Reunião encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeetingDTO"
              example:
                id: 1
                name: "Reunião de Planejamento Q4"
                snowflake: "snowflake-abc-123"
                state: "SP"
        "200" null:
          description: Reunião não encontrada (retorna null — comportamento legado)
          content: {}
        "500":
          description: Erro interno ao buscar reunião
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

    delete:
      summary: Desativar reunião (soft delete)
      description: |
        Desativa uma reunião definindo `active = false`.
        
        **Comportamento:**
        - Soft delete: a reunião permanece no banco mas fica inativa
        - Usa o ID numérico (`id`), diferente do GET que usa snowflake
        - Reuniões inativas não aparecem nas listagens
      operationId: deactivateMeeting
      tags:
        - Meetings
      parameters:
        - name: id
          in: path
          description: O ID numérico da reunião (LONG)
          required: true
          schema:
            type: integer
            format: int64
            example: 1
      responses:
        "200":
          description: Reunião desativada com sucesso
          content: {}
        "404":
          description: Reunião não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Not Found"
                status: 404
                detail: "Meeting with id 999 not found"
      security: []

  /meeting/state/{state}:
    get:
      summary: Listar reuniões por estado
      description: |
        Retorna lista paginada de reuniões ativas filtradas pelo código do estado.
        
        **Comportamento:**
        - Retorna apenas reuniões com `active = true` E `state = {state}`
        - Paginação via query params: `page`, `size`, `sort`
        - Retorna `null` (200 OK) se houver erro — comportamento legado
      operationId: listMeetingsByState
      tags:
        - Meetings
      parameters:
        - name: state
          in: path
          description: Código do estado (2 caracteres, ex: SP, RJ, MG)
          required: true
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
            example: "SP"
        - name: page
          in: query
          description: Número da página (zero-indexed)
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: Tamanho da página
          required: false
          schema:
            type: integer
            format: int32
            default: 1000
        - name: sort
          in: query
          description: Critério de ordenação
          required: false
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: Lista paginada de reuniões do estado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageMeetingDTO"
              example:
                content:
                  - id: 1
                    name: "Reunião SP-01"
                    snowflake: "snowflake-sp-01"
                    state: "SP"
                totalElements: 1
                totalPages: 1
                size: 1000
                number: 0
        "500":
          description: Erro interno ao processar a requisição
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

components:
  schemas:
    MeetingDTO:
      type: object
      description: Representação de uma reunião nas respostas da API
      required:
        - id
        - name
        - snowflake
        - state
      properties:
        id:
          type: integer
          format: int64
          description: ID numérico auto-incremento
          example: 1
        name:
          type: string
          description: Nome da reunião (até 200 caracteres)
          maxLength: 200
          example: "Reunião de Planejamento Q4"
        snowflake:
          type: string
          description: Identificador único da reunião (string, até 50 caracteres)
          maxLength: 50
          example: "snowflake-abc-123"
        state:
          type: string
          description: Código do estado (2 caracteres)
          pattern: "^[A-Z]{2}$"
          maxLength: 2
          example: "SP"

    CreateMeetingDTO:
      type: object
      description: Dados para criar uma nova reunião
      required:
        - snowflake
        - state
      properties:
        name:
          type: string
          description: Nome da reunião (opcional, sem limite de tamanho definido)
          nullable: true
          example: "Reunião de Planejamento Q4"
        snowflake:
          type: string
          description: Identificador único da reunião (obrigatório, não pode ser vazio)
          maxLength: 50
          example: "snowflake-abc-123"
        state:
          type: string
          description: Código do estado (obrigatório, não pode ser vazio, até 2 caracteres)
          pattern: "^[A-Z]{2}$"
          maxLength: 2
          example: "SP"

    UpdateMeetingDTO:
      type: object
      description: Dados para atualizar uma reunião (partial update)
      required:
        - snowflake
        - state
      properties:
        name:
          type: string
          description: Novo nome da reunião (opcional — se não informado, nome não é alterado)
          nullable: true
          example: "Reunião de Planejamento Q4 Atualizada"
        snowflake:
          type: string
          description: |
            Identificador único da reunião (obrigatório).
            Usado para localizar a reunião a ser atualizada.
          maxLength: 50
          example: "snowflake-abc-123"
        state:
          type: string
          description: |
            Novo código do estado (obrigatório).
            Mínimo 2 caracteres, máximo 2 caracteres.
          pattern: "^[A-Z]{2}$"
          maxLength: 2
          example: "RJ"

    PageMeetingDTO:
      type: object
      description: |
        Wrapper de paginação Spring Data com conteúdo do tipo MeetingDTO.
        Segue o formato padrão de respostas paginadas do Spring Data Rest.
      properties:
        content:
          type: array
          description: Lista de reuniões na página atual
          items:
            $ref: "#/components/schemas/MeetingDTO"
          nullable: true
        pageable:
          type: object
          description: Informações de paginação
          properties:
            pageIndex:
              type: integer
              format: int32
              example: 0
            pageSize:
              type: integer
              format: int32
              example: 1000
            sort:
              type: array
              description: Critérios de ordenação
              nullable: true
              items:
                type: object
                properties:
                  property:
                    type: string
                    example: "id"
                  direction:
                    type: string
                    enum: [ASC, DESC]
                    example: "DESC"
            offset:
              type: integer
              format: int64
              example: 0
            unpaged:
              type: boolean
              example: false
            paged:
              type: boolean
              example: true
        last:
          type: boolean
          description: Indica se esta é a última página
          example: false
        totalElements:
          type: integer
          format: int64
          description: Total de reuniões encontradas
          example: 50
        totalPages:
          type: integer
          format: int32
          description: Total de páginas
          example: 1
        size:
          type: integer
          format: int32
          description: Tamanho da página
          example: 1000
        number:
          type: integer
          format: int32
          description: Número da página atual
          example: 0
        first:
          type: boolean
          description: Indica se esta é a primeira página
          example: true
        sort:
          type: array
          description: Critérios de ordenação aplicados
          nullable: true
          items:
            type: object
            properties:
              property:
                type: string
                example: "id"
              direction:
                type: string
                enum: [ASC, DESC]
                example: "DESC"
        numberOfElements:
          type: integer
          format: int32
          description: Número de elementos na página atual
          example: 2
        empty:
          type: boolean
          description: Indica se a página está vazia
          example: false

    ProblemDetail:
      type: object
      description: |
        Formato de erro baseado em RFC 7807 (Problem Details for HTTP APIs).
        Equivalente ao erro padrão do Spring Boot.
      properties:
        type:
          type: string
          format: uri
          description: URI que descreve o tipo do erro
          example: "about:blank"
        title:
          type: string
          description: Resumo do tipo de erro
          example: "Bad Request"
        status:
          type: integer
          format: int32
          description: Código HTTP de status
          example: 400
        detail:
          type: string
          description: Mensagem detalhada do erro
          example: "Validation failed"
        instance:
          type: string
          format: uri
          description: URI da instância da requisição
          example: "/meeting"
      example:
        type: "about:blank"
        title: "Bad Request"
        status: 400
        detail: "Validation failed"
        instance: "/meeting"

  securitySchemes: {}

security: []

tags:
  - name: Meetings
    description: Operações relacionadas a reuniões
